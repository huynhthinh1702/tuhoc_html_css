<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tự học tạo table</title>
  </head>
  <body>
    <h1>Học table</h1>
    <table>
      <thead>
        <tr>
          <th>Tên sản phẩm</th>
          <th>Giá</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Áo phông</td>
          <td>100.000 vnđ</td>
        </tr>
        <tr>
          <td>Quần jean</td>
          <td>200.000 vnđ</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td>Tổng cổng</td>
          <td>300.000 vnđ</td>
        </tr>
      </tfoot>
    </table>

    <h2>lý thuyết</h2>
    <p>td: table data, th: table header, tr: table row</p>
  </body>
</html>
